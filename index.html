<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>coteve — Unveil Your Smile</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- 영문 폰트: Adobe Fonts 'ITC Avant Garde Gothic Pro' 웹 프로젝트 코드 (아래 주소를 내 프로젝트 코드로 교체) -->
  <!-- <link rel="stylesheet" href="https://use.typekit.net/XXXXXXX.css" /> -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 웹캠 영상 + 베일 그래픽이 그려지는 화면 -->
  <canvas id="stage"></canvas>
  <video id="cam" playsinline muted></video>

  <!-- 손 위치를 알려주는 작은 표시 -->
  <div id="hand-dot" class="hand-dot"></div>

  <!-- 상단 중앙 로고 (첫 화면·체험 화면 공통, 촬영한 사진에는 들어가지 않음) -->
  <img id="top-logo" class="top-logo" src="Logo.svg" alt="coteve" />

  <!-- 시작(홈) 화면 -->
  <section id="intro" class="overlay">
    <div class="intro-card">
      <h1 class="en">Unveil the<br />Glass Smile</h1>
      <p class="desc">손으로 화면을 쓸어<br class="br-narrow" /> 베일을 걷어내 보세요.</p>
      <button id="start-btn" class="btn primary en">Enable Camera</button>
      <p class="fine">카메라 영상은 이 기기 안에서만 처리되며,<br class="br-narrow" /> 저장되거나 전송되지 않아요.</p>
    </div>
  </section>

  <!-- 준비 중 -->
  <section id="loading" class="overlay hidden">
    <div class="spinner"></div>
    <p>카메라와 손 인식을 준비하고 있어요…</p>
  </section>

  <!-- 오류 -->
  <section id="error" class="overlay hidden">
    <div class="intro-card">
      <h2>카메라를 사용할 수 없어요</h2>
      <p id="error-msg" class="desc"></p>
      <button id="retry-btn" class="btn primary">다시 시도하기</button>
      <button id="error-home-btn" class="btn ghost">처음으로</button>
    </div>
  </section>

  <!-- 체험 중 화면 UI -->
  <div id="hud" class="hud hidden">
    <div id="status" class="status"><span class="dot"></span><span id="status-text">손을 화면에 보여 주세요</span></div>
    <button id="home-btn" class="btn ghost small home-btn" aria-label="처음으로" title="처음으로"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span class="label">처음으로</span></button>
    <p id="hint" class="hint">손으로 화면을 좌우로 쓸어주세요</p>
    <!-- 하단 버튼: 다시 체험하기(왼쪽) · 촬영 셔터(가운데) · 사진/영상 선택(오른쪽) -->
    <div class="bottom-bar">
      <button id="reset-btn" class="icon-btn" aria-label="다시 체험하기" title="다시 체험하기"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/></svg></button>
      <button id="shoot-btn" class="shutter" aria-label="사진 찍기" title="사진 찍기"></button>
      <div class="capture-mode" role="radiogroup" aria-label="촬영 방식">
        <button class="mode-btn selected" data-mode="photo" aria-label="사진" title="사진"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg></button>
        <button class="mode-btn" data-mode="video" aria-label="영상" title="영상"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.5l6-3.5v10l-6-3.5z"/></svg></button>
      </div>
    </div>
  </div>

  <!-- 촬영 카운트다운 / 플래시 -->
  <div id="countdown" class="countdown hidden"></div>
  <div id="rec-badge" class="rec-badge hidden"><span class="rec-dot"></span><span id="rec-time">0:00</span></div>
  <div id="flash" class="flash"></div>

  <!-- 촬영 결과 -->
  <section id="shot" class="overlay shot hidden">
    <div class="shot-card">
      <img id="shot-img" alt="촬영한 이미지 미리보기" />
      <video id="shot-video" class="hidden" muted loop playsinline autoplay></video>
      <div class="shot-side">
        <h2 id="shot-title">멋진 순간이 담겼어요</h2>
        <p id="shot-sub" class="shot-sub">화면 그대로 이미지로 저장할 수 있어요.</p>
        <button id="save-btn" class="btn primary wide">이미지 저장</button>
        <button id="share-btn" class="btn ghost wide hidden">공유하기</button>
        <button id="close-shot-btn" class="btn link">닫고 계속 체험하기</button>
      </div>
    </div>
  </section>

  <!-- 베일 컬러 선택 -->
  <div id="controls" class="controls">
    <div class="ctrl-row">
      <span class="ctrl-label">베일 컬러</span>
      <div class="swatches" role="radiogroup" aria-label="베일 컬러">
        <button class="swatch" data-color="#FF80A0" style="--c:#FF80A0" aria-label="분홍색"></button>
        <button class="swatch" data-color="#AB7EFF" style="--c:#AB7EFF" aria-label="보라색"></button>
        <button class="swatch" data-color="#80EAFF" style="--c:#80EAFF" aria-label="하늘색"></button>
        <button class="swatch" data-color="#80FF8A" style="--c:#80FF8A" aria-label="초록색"></button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
