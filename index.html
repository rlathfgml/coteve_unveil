<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>coteve — Unveil Your Smile</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 웹캠 영상 + 베일 그래픽이 그려지는 화면 -->
  <canvas id="stage"></canvas>
  <video id="cam" playsinline muted></video>

  <!-- 손 위치를 알려주는 작은 표시 -->
  <div id="hand-dot" class="hand-dot"></div>

  <!-- 시작(홈) 화면 -->
  <section id="intro" class="overlay">
    <div class="intro-card">
      <img class="logo" src="Logo.svg" alt="coteve" />
      <h1>Unveil Your Teeth.<br />Reveal Your Smile.</h1>
      <p class="desc">카메라를 켜고, 손날로 화면을 옆으로 쓸어<br />베일을 걷어내 보세요.</p>
      <button id="start-btn" class="btn primary">체험 시작하기</button>
      <p class="fine">카메라 영상은 이 기기 안에서만 처리되며, 저장되거나 전송되지 않아요.</p>
    </div>
  </section>

  <!-- 준비 중 -->
  <section id="loading" class="overlay hidden">
    <div class="spinner"></div>
    <p>카메라와 손 인식을 준비하고 있어요…</p>
  </section>

  <!-- 오류 -->
  <section id="error" class="overlay hidden">
    <div class="intro-card">
      <h2>카메라를 사용할 수 없어요</h2>
      <p id="error-msg" class="desc"></p>
      <button id="retry-btn" class="btn primary">다시 시도하기</button>
      <button id="error-home-btn" class="btn ghost">처음으로</button>
    </div>
  </section>

  <!-- 체험 중 화면 UI -->
  <div id="hud" class="hud hidden">
    <div id="status" class="status"><span class="dot"></span><span id="status-text">손을 화면에 보여 주세요</span></div>
    <button id="home-btn" class="btn ghost small home-btn">처음으로</button>
    <p id="hint" class="hint">손을 펴고, 손날로 화면을 좌우로 쓸어 주세요</p>
    <p id="done-copy" class="done-copy">Reveal Your Smile.</p>
    <div class="bottom-bar">
      <button id="reset-btn" class="btn ghost">다시 체험하기</button>
      <button id="shoot-btn" class="btn primary">촬영하기</button>
    </div>
  </div>

  <!-- 촬영 카운트다운 / 플래시 -->
  <div id="countdown" class="countdown hidden"></div>
  <div id="flash" class="flash"></div>

  <!-- 촬영 결과 -->
  <section id="shot" class="overlay shot hidden">
    <div class="shot-card">
      <img id="shot-img" alt="촬영한 이미지 미리보기" />
      <div class="shot-side">
        <h2>멋진 순간이 담겼어요</h2>
        <p class="shot-sub">화면 그대로 이미지로 저장할 수 있어요.</p>
        <button id="save-btn" class="btn primary wide">이미지 저장</button>
        <button id="share-btn" class="btn ghost wide hidden">공유하기</button>
        <button id="close-shot-btn" class="btn link">닫고 계속 체험하기</button>
      </div>
    </div>
  </section>

  <!-- 베일 설정 (컬러 / 닦이는 크기) -->
  <div id="controls" class="controls">
    <div class="ctrl-row">
      <span class="ctrl-label">베일 컬러</span>
      <div class="swatches" role="radiogroup" aria-label="베일 컬러">
        <button class="swatch" data-color="#FF80A0" style="--c:#FF80A0" aria-label="분홍색"></button>
        <button class="swatch" data-color="#AB7EFF" style="--c:#AB7EFF" aria-label="보라색"></button>
        <button class="swatch" data-color="#80EAFF" style="--c:#80EAFF" aria-label="하늘색"></button>
        <button class="swatch" data-color="#8EFFC3" style="--c:#8EFFC3" aria-label="민트색"></button>
      </div>
    </div>
    <div id="size-row" class="ctrl-row hidden">
      <span class="ctrl-label">닦이는 크기</span>
      <input id="size" type="range" min="0.08" max="0.4" step="0.01" value="0.2" aria-label="닦이는 크기" />
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
